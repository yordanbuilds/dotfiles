model = "gpt-5.5"  # Replace with your actual Azure model deployment name
model_provider = "azure"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
approvals_reviewer = "user"

[model_providers.azure]
name = "Azure OpenAI"
base_url = "https://tech-mapqw640-eastus2.openai.azure.com/openai/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"

[projects."/home/void/code/sell"]
trust_level = "trusted"

[projects."/home/void"]
trust_level = "trusted"

[projects."/home/void/dotfiles"]
trust_level = "trusted"

[projects."/home/void/code/zenith"]
trust_level = "trusted"

[mcp_servers.laravel-boost]
command = "php"
args = ["artisan", "boost:mcp"]

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp"

[mcp_servers.sentry.tools.execute_sentry_tool]
approval_mode = "approve"

[mcp_servers.sentry.tools.update_issue]
approval_mode = "approve"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[plugins."superpowers@openai-curated"]
enabled = true
