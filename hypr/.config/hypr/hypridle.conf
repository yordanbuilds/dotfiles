# Displays off on idle without locking — the v4 shell only powers displays
# off after the lock engages, so this restores the v3 dpms listener.
# Screensaver stays disabled via `omarchy toggle screensaver`.
# Lock (3h) and suspend handling remain with the Omarchy shell.
# On a fresh install: pacman -S hypridle && systemctl --user enable --now hypridle

listener {
    timeout = 600                                            # 10min
    on-timeout = hyprctl dispatch dpms off                   # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r # screen on when activity is detected
}
