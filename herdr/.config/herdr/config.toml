# Herdr config — stowed from ~/dotfiles/herdr/
# Keybindings aligned with tmux muscle memory (prefix ctrl+a, | split, r reload);
# detach stays on default prefix+q by choice.

[theme]
name = "rose-pine-dawn"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "off"

[keys]
prefix = "ctrl+a"
split_vertical = "prefix+|"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
rename_tab = "prefix+comma"
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+backtick"
type = "popup"
command = "fish"
width = "80%"
height = "80%"
