onboarding = false
# Herdr config — stowed from ~/dotfiles/herdr/
# Keybindings aligned with tmux muscle memory (prefix ctrl+a, | split, r reload);
# detach stays on default prefix+q by choice.
# [theme] lives in the marked block at the end of this file, managed by the
# omarchy theme-set hook (~/dotfiles/omarchy/.config/omarchy/hooks/theme-set).

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[ui.toast]
delivery = "off"

[keys]
# alt+a is only a leader for rare actions; hot motions are direct Alt chords.
prefix = "alt+a"

# direct hot layer (no prefix)
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
previous_tab = "alt+shift+left"
next_tab = "alt+shift+right"
previous_workspace = "alt+shift+up"
next_workspace = "alt+shift+down"
switch_tab = "alt+1..9"
new_tab = "alt+t"
zoom = "alt+z"
split_vertical = "alt+|"
split_horizontal = "alt+minus"
open_notification_target = "alt+o"

# leader layer (rare actions; detach/close/picker etc. stay on defaults)
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
rename_tab = "prefix+comma"
switch_workspace = "prefix+shift+1..9"
next_agent = "alt+down"
previous_agent = "alt+up"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+backtick"
type = "popup"
command = "fish"
width = "80%"
height = "80%"

